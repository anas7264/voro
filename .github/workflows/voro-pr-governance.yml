name: VORO - Baseline-aware Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of an already open PR'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: voro-auto-merge
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - name: Check PR author and sensitive files
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number;
            const {data:p} = await github.rest.pulls.get({owner,repo,pull_number:number});
            if (p.state !== 'open' || p.draft || p.base.ref !== 'main' ||
                p.user.login !== owner || p.head.repo?.full_name !== owner+'/'+repo ||
                p.labels.some(l=>l.name==='voro-manual-review')) {
              core.setFailed('PR is ineligible for automatic merge'); return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{
              owner,repo,pull_number:number,per_page:100
            });
            if (!files.length || files.some(f=>f.filename.startsWith('.github/') ||
                ['webs/package.json','webs/package-lock.json','webs/pnpm-lock.yaml',
                 'webs/src/utils/crypto.js','webs/src/utils/storage.js'].includes(f.filename))) {
              core.setFailed('Empty or sensitive diff: manual review required'); return;
            }
            const {data:branch}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            core.setOutput('number',String(number));
            core.setOutput('head',p.head.sha);
            core.setOutput('base',branch.commit.sha);

      - name: Checkout known main snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webs/package-lock.json

      - name: Install dependencies from main
        working-directory: webs
        run: npm ci --no-audit --no-fund

      - name: Capture existing failures on main
        env:
          STAGE: baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          tasks = {'build': ['npm','run','build']}
          for name in ('verify_storage_security.js','verify_masterclass_luxury.cjs',
                       'verify_daily_perf_v20.cjs','verify_formatters_hardening.js',
                       'verify_calculators_perf.js','verify_async_storage_purge.js'):
              tasks[name] = ['node',name]
          results={}
          for name,cmd in tasks.items():
              optional=name=='verify_async_storage_purge.js'
              if name!='build' and not pathlib.Path('webs',name).exists():
                  results[name]=None if optional else {'code':127,'signature':'missing required test'}
                  continue
              try:
                  p=subprocess.run(cmd,cwd='webs',capture_output=True,text=True,
                                   errors='replace',timeout=180)
                  output=p.stdout+'\n'+p.stderr
                  code=p.returncode
              except subprocess.TimeoutExpired:
                  output='Test timed out'; code=124
              pathlib.Path(os.environ['RUNNER_TEMP'],os.environ['STAGE']+'-'+name+'.log').write_text(output)
              lines=re.sub(r'\x1b\[[0-9;]*m','',output).splitlines()
              errors=[s.strip() for s in lines if re.match(
                  r'^\s*(?:AssertionError(?:\s+\[[^]]+\])?|[A-Za-z]*Error|FAIL|✗)\s*[:\- ]',s)]
              meaningful=errors[:8] or [s.strip() for s in lines if s.strip() and not s.lstrip().startswith('at ')][-3:]
              signature=hashlib.sha256('\n'.join(meaningful).encode()).hexdigest() if code else ''
              results[name]={'code':code,'signature':signature}
              print(f'{name}: ' + ('PASS' if code==0 else f'EXISTING FAILURE ({code})'))
          pathlib.Path(os.environ['RUNNER_TEMP'],'baseline.json').write_text(json.dumps(results))
          PY
          git diff --exit-code

      - name: Apply PR in a disposable merge preview
        shell: bash
        env:
          PR_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$PR_HEAD"
          git -c user.name='VORO CI' -c user.email='ci@users.noreply.github.com' merge --no-commit --no-ff "$PR_HEAD"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No effective change compared with main; refusing duplicate merge' >&2
            exit 1
          fi

      - name: Install dependencies after the PR
        working-directory: webs
        run: npm ci --no-audit --no-fund

      - name: Compare candidate errors against main
        env:
          STAGE: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          tasks = {'build': ['npm','run','build']}
          for name in ('verify_storage_security.js','verify_masterclass_luxury.cjs',
                       'verify_daily_perf_v20.cjs','verify_formatters_hardening.js',
                       'verify_calculators_perf.js','verify_async_storage_purge.js'):
              tasks[name]=['node',name]
          baseline=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'baseline.json').read_text())
          problems=[]; improvements=[]
          for name,cmd in tasks.items():
              optional=name=='verify_async_storage_purge.js'
              if name!='build' and not pathlib.Path('webs',name).exists():
                  current=None if optional else {'code':127,'signature':'missing required test'}
              else:
                  try:
                      p=subprocess.run(cmd,cwd='webs',capture_output=True,text=True,
                                       errors='replace',timeout=180)
                      output=p.stdout+'\n'+p.stderr; code=p.returncode
                  except subprocess.TimeoutExpired:
                      output='Test timed out'; code=124
                  pathlib.Path(os.environ['RUNNER_TEMP'],'candidate-'+name+'.log').write_text(output)
                  lines=re.sub(r'\x1b\[[0-9;]*m','',output).splitlines()
                  errors=[s.strip() for s in lines if re.match(
                      r'^\s*(?:AssertionError(?:\s+\[[^]]+\])?|[A-Za-z]*Error|FAIL|✗)\s*[:\- ]',s)]
                  meaningful=errors[:8] or [s.strip() for s in lines if s.strip() and not s.lstrip().startswith('at ')][-3:]
                  current={'code':code,'signature':hashlib.sha256(
                      '\n'.join(meaningful).encode()).hexdigest() if code else ''}
              previous=baseline.get(name)
              old_status='absent' if previous is None else ('PASS' if previous['code']==0 else 'FAIL')
              new_status='absent' if current is None else ('PASS' if current['code']==0 else 'FAIL')
              print(f'{name}: {old_status} -> {new_status}')
              if current is None:
                  if previous is not None: problems.append(name+' removed')
                  continue
              if previous is None:
                  if current['code']: problems.append(name+' new test fails')
              elif current['code'] and (
                  previous['code']==0 or previous['signature']!=current['signature']):
                  problems.append(name+' new or changed failure')
              elif previous['code'] and current['code']==0:
                  improvements.append(name)
          summary=os.environ['GITHUB_STEP_SUMMARY']
          with open(summary,'a') as f:
              f.write('### Baseline comparison\n')
              f.write('Pre-existing failures are tolerated only if their detected error signatures remain unchanged.\n')
              f.write('Improvements: '+(', '.join(improvements) or 'no existing failing check fixed')+'\n')
              f.write('Regressions: '+(', '.join(problems) or 'none detected')+'\n')
          if problems:
              print('Blocking merge:',', '.join(problems),file=sys.stderr)
              sys.exit(1)
          print('No new failures detected by the selected checks.')
          PY

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge exact tested revision only
        uses: actions/github-script@v7
        env:
          NUMBER: ${{ needs.verify.outputs.number }}
          HEAD: ${{ needs.verify.outputs.head }}
          BASE: ${{ needs.verify.outputs.base }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const number=Number(process.env.NUMBER);
            const {data:p}=await github.rest.pulls.get({owner,repo,pull_number:number});
            const {data:branch}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if (p.state!=='open'||p.draft||p.base.ref!=='main'||
                p.user.login!==owner||p.head.repo?.full_name!==owner+'/'+repo||
                p.labels.some(l=>l.name==='voro-manual-review')||
                p.head.sha!==process.env.HEAD||branch.commit.sha!==process.env.BASE||
                p.mergeable!==true) {
              core.setFailed('PR changed, main moved or mergeability is unknown/blocked');
              return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{
              owner,repo,pull_number:number,per_page:100
            });
            if (!files.length||files.some(f=>f.filename.startsWith('.github/')||
                ['webs/package.json','webs/package-lock.json','webs/pnpm-lock.yaml',
                 'webs/src/utils/crypto.js','webs/src/utils/storage.js'].includes(f.filename))) {
              core.setFailed('Sensitive files changed since validation'); return;
            }
            const {data:result}=await github.rest.pulls.merge({
              owner,repo,pull_number:number,sha:process.env.HEAD,merge_method:'squash'
            });
            if(!result.merged)core.setFailed(result.message||'GitHub rejected merge');
