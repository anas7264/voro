name: VORO - Safe Serial PR Gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: voro-serial-pr-gate
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
      decision: ${{ steps.check.outputs.decision }}
    steps:
      - id: pr
        name: Select exactly one owner-authored PR
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,repo,state:'open',base:'main',per_page:100
            });
            const {data:mainBranch}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            const currentMain=mainBranch.commit.sha;
            prs.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at) || a.number-b.number);
            let p;
            for(const candidate of prs) {
              if(candidate.draft || candidate.user?.login!==owner ||
                 candidate.head.repo?.full_name!==`${owner}/${repo}`) continue;
              const marker=`<!-- voro-gate-v4:${candidate.head.sha}:${currentMain} -->`;
              const comments=await github.paginate(github.rest.issues.listComments,{
                owner,repo,issue_number:candidate.number,per_page:100
              });
              const previouslyHandled=comments.some(c=>c.user?.login==='github-actions[bot]' &&
                (c.body?.includes(marker) ||
                 (candidate.labels.some(l=>l.name==='voro-manual-review') &&
                  c.body?.includes(`<!-- voro-gate-v4:${candidate.head.sha}:`))));
              if(previouslyHandled)continue;
              p=candidate;
              break;
            }
            if(!p) {core.notice('Queue drained: no active runner until next event.');return;}
            core.setOutput('number',String(p.number));
            core.setOutput('head',p.head.sha);
            core.setOutput('base',currentMain);
            core.notice(`Selected #${p.number}`);

      - name: Checkout trusted default branch
        if: steps.pr.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - id: preview
        name: Try merge in disposable read-only working tree
        if: steps.pr.outputs.number != ''
        continue-on-error: true
        shell: bash
        env:
          PR_HEAD: ${{ steps.pr.outputs.head }}
          BASE_HEAD: ${{ steps.pr.outputs.base }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$PR_HEAD"
          if [[ "$(git rev-parse origin/main)" != "$BASE_HEAD" ]]; then
            echo state=stale >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout --detach origin/main
          if ! git -c user.name='VORO CI' -c user.email='ci@users.noreply.github.com' merge --no-commit --no-ff "$PR_HEAD"; then
            echo state=conflict >> "$GITHUB_OUTPUT"
            git merge --abort || true
            exit 0
          fi
          if git diff HEAD --quiet; then
            echo state=duplicate >> "$GITHUB_OUTPUT"
          else
            git diff --check HEAD
            git diff --name-only HEAD > "$RUNNER_TEMP/voro-changed.txt"
            echo state=changed >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.preview.outputs.state == 'changed'
        with:
          node-version: '22'

      - id: checks
        name: Locked install, build and available regression suites
        if: steps.preview.outputs.state == 'changed'
        continue-on-error: true
        working-directory: webs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          for t in verify_storage_security.js verify_masterclass_luxury.cjs verify_daily_perf_v20.cjs verify_formatters_hardening.js verify_calculators_perf.js; do
            test -f "$t" || { echo "Missing required regression test: $t" >&2; exit 1; }
            node "$t"
          done
          if grep -Eq '^webs/src/(context/(AppContext|StorageContext)\.jsx|pages/Settings\.jsx|utils/(storage|crypto)\.js)$' "$RUNNER_TEMP/voro-changed.txt"; then
            test -f verify_async_storage_purge.js || { echo "Missing storage regression test" >&2; exit 1; }
          fi
          if [[ -f verify_async_storage_purge.js ]]; then node verify_async_storage_purge.js; fi
          while IFS= read -r file; do
            case "$file" in
              webs/*.js|webs/*.cjs|webs/*.mjs|webs/src/utils/*.js)
                test ! -f "../$file" || node --check "../$file" ;;
            esac
          done < "$RUNNER_TEMP/voro-changed.txt"

      - id: autofix
        name: Try minimal deterministic repair in the disposable workspace
        if: steps.checks.outcome == 'failure' && steps.preview.outputs.state == 'changed'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fixes = [
            ['webs/src/pages/Calculators.jsx', text => {
              const expected = "import React, { useEffect, useState, useMemo, memo, useRef, useId } from 'react';";
              if (!text.includes('useCallback(')) return text;
              return text.replace(expected,
                "import React, { useEffect, useState, useMemo, memo, useRef, useId, useCallback } from 'react';");
            }],
            ['webs/src/components/NotificationContainer.jsx', text => text.replace(
              'import React, { memo } from "react";\nimport { useRef, useId, useMemo, useCallback } from "react";',
              'import React, { memo, useRef, useId, useMemo, useCallback } from "react";'
            )],
            ['webs/verify_storage_security.js', text => {
              if (!text.includes("path.resolve('./src/utils/storage.js')")) return text;
              let result = text.replace("path.resolve('./src/utils/storage.js')",
                "path.resolve(path.dirname(fileURLToPath(import.meta.url)), './src/utils/storage.js')");
              if (!result.includes("import { fileURLToPath } from 'url';")) {
                result = result.replace("import path from 'path';",
                  "import path from 'path';\nimport { fileURLToPath } from 'url';");
              }
              return result;
            }]
          ];
          let count=0;
          const touched=new Set(fs.readFileSync(process.env.RUNNER_TEMP+'/voro-changed.txt','utf8').trim().split('\n'));
          for (const [file, transform] of fixes) {
            if (!touched.has(file) || !fs.existsSync(file)) continue;
            const before=fs.readFileSync(file,'utf8'), after=transform(before);
            if (before!==after) {fs.writeFileSync(file,after);count++;}
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${count>0}\n`);
          NODE

      - id: repaired_checks
        name: Reinstall and rerun the complete suite after repair
        if: steps.autofix.outputs.changed == 'true'
        continue-on-error: true
        working-directory: webs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          for t in verify_storage_security.js verify_masterclass_luxury.cjs verify_daily_perf_v20.cjs verify_formatters_hardening.js verify_calculators_perf.js; do
            test -f "$t" || { echo "Missing required regression test: $t" >&2; exit 1; }
            node "$t"
          done
          if grep -Eq '^webs/src/(context/(AppContext|StorageContext)\.jsx|pages/Settings\.jsx|utils/(storage|crypto)\.js)$' "$RUNNER_TEMP/voro-changed.txt"; then
            test -f verify_async_storage_purge.js || { echo "Missing storage regression test" >&2; exit 1; }
          fi
          if [[ -f verify_async_storage_purge.js ]]; then node verify_async_storage_purge.js; fi
          while IFS= read -r file; do
            case "$file" in
              webs/*.js|webs/*.cjs|webs/*.mjs|webs/src/utils/*.js)
                test ! -f "../$file" || node --check "../$file" ;;
            esac
          done < "$RUNNER_TEMP/voro-changed.txt"

      - id: check
        name: Fail closed when checks are absent or unsuccessful
        if: always() && steps.pr.outputs.number != ''
        env:
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
          PREVIEW_STATE: ${{ steps.preview.outputs.state }}
          CHECK_OUTCOME: ${{ steps.checks.outcome }}
          FIX_CHANGED: ${{ steps.autofix.outputs.changed }}
          RECHECK_OUTCOME: ${{ steps.repaired_checks.outcome }}
        shell: bash
        run: |
          decision=reject
          if [[ "$PREVIEW_OUTCOME" != success ]]; then decision=reject
          elif [[ "$PREVIEW_STATE" == stale ]]; then decision=stale
          elif [[ "$PREVIEW_STATE" == duplicate ]]; then decision=duplicate
          elif [[ "$PREVIEW_STATE" == conflict ]]; then decision=conflict
          elif [[ "$PREVIEW_STATE" == changed && "$CHECK_OUTCOME" == success ]]; then decision=pass
          elif [[ "$PREVIEW_STATE" == changed && "$FIX_CHANGED" == true && "$RECHECK_OUTCOME" == success ]]; then decision=repair
          fi
          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "PR #${{ steps.pr.outputs.number }}: $decision" >> "$GITHUB_STEP_SUMMARY"

  decide:
    needs: validate
    if: always() && needs.validate.outputs.number != '' && needs.validate.outputs.decision != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Validate freshness and decide on single PR
        id: decision
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          NUM: ${{ needs.validate.outputs.number }}
          SHA: ${{ needs.validate.outputs.head }}
          BASE: ${{ needs.validate.outputs.base }}
          VERDICT: ${{ needs.validate.outputs.decision }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const n=Number(process.env.NUM);
            const {data:p}=await github.rest.pulls.get({owner,repo,pull_number:n});
            if (p.state!=='open'||p.draft||p.head.sha!==process.env.SHA||
                p.base.ref!=='main'||
                p.user?.login!==owner||p.head.repo?.full_name!==`${owner}/${repo}`) {
              core.notice('PR changed; stale verdict discarded');return;
            }
            const existing = new Set(p.labels.map(l=>l.name));
            async function tag(name,color='b60205') {
              try {await github.rest.issues.createLabel({owner,repo,name,color});}
              catch(e){if(e.status!==422) throw e;}
              if(!existing.has(name))
                await github.rest.issues.addLabels({owner,repo,issue_number:n,labels:[name]});
            }
            async function note(msg) {
              await github.rest.issues.createComment({owner,repo,issue_number:n,body:msg});
            }
            const dup={855:858,856:858,857:858,860:858,862:858,863:858,864:858,867:858,861:865};
            if (dup[n]) {
              await tag('voro-manual-review');
              await note(`Duplicate/overlapping repair of #${dup[n]}; blocked from auto-merge. Consolidate unique tests before closing.`);
              return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:n,per_page:100});
            if(files.some(f=>f.filename.startsWith('.github/')||
                /^(webs\/src\/utils\/(crypto|storage)\.js|webs\/(package\.json|package-lock\.json|pnpm-lock\.yaml))$/.test(f.filename))) {
              await tag('voro-manual-review');
              await note('Sensitive workflow, cryptography, storage engine or dependencies changed; human review required.');
              return;
            }
            const verdict=process.env.VERDICT;
            if (existing.has('voro-manual-review')) {
              core.notice('Manually flagged PR; no automatic changes or merge.');
              return;
            }
            if(verdict==='stale')return;
            if(verdict==='duplicate') {
              await tag('voro-reviewed','ededed');
              await note('No new changes compared with main. Review for closure rather than duplicate merge.');
              return;
            }
            if(verdict==='repair') {
              if (existing.has('voro-autofix-attempted')) {
                await tag('voro-ci-rejected','d73a4a');
                await note('A deterministic repair was already attempted. No second automatic modification.');
                return;
              }
              const safe = [
                ['webs/src/pages/Calculators.jsx', text => {
                  if (!text.includes('useCallback(')) return text;
                  return text.replace(
                    "import React, { useEffect, useState, useMemo, memo, useRef, useId } from 'react';",
                    "import React, { useEffect, useState, useMemo, memo, useRef, useId, useCallback } from 'react';");
                }],
                ['webs/src/components/NotificationContainer.jsx', text => text.replace(
                  'import React, { memo } from "react";\nimport { useRef, useId, useMemo, useCallback } from "react";',
                  'import React, { memo, useRef, useId, useMemo, useCallback } from "react";'
                )],
                ['webs/verify_storage_security.js', text => {
                  if (!text.includes("path.resolve('./src/utils/storage.js')")) return text;
                  let result=text.replace("path.resolve('./src/utils/storage.js')",
                    "path.resolve(path.dirname(fileURLToPath(import.meta.url)), './src/utils/storage.js')");
                  if (!result.includes("import { fileURLToPath } from 'url';")) {
                    result=result.replace("import path from 'path';",
                      "import path from 'path';\nimport { fileURLToPath } from 'url';");
                  }
                  return result;
                }]
              ];
              const pending=[];
              for (const [path, fix] of safe) {
                const {data:file}=await github.rest.repos.getContent({
                  owner,repo,path,ref:p.head.ref
                });
                if (Array.isArray(file) || !file.sha || !file.content) continue;
                const before=Buffer.from(file.content,'base64').toString('utf8');
                const after=fix(before);
                if (before!==after) pending.push({path,sha:file.sha,content:after});
              }
              if (!pending.length) {
                await tag('voro-ci-rejected','d73a4a');
                await note('Repair previously passed in simulation but no allowed patch was available; requires manual diagnosis.');
                return;
              }
              await tag('voro-autofix-attempted','1d76db');
              for(const item of pending) {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,repo,path:item.path,sha:item.sha,branch:p.head.ref,
                  content:Buffer.from(item.content).toString('base64'),
                  message:`fix(ci): apply verified deterministic fix for PR #${n}`
                });
              }
              await note(`Applied ${pending.length} deterministic repair(s). Running checks again on the new commit before approval or merge.`);
              await github.rest.actions.createWorkflowDispatch({
                owner,repo,workflow_id:'voro-pr-governance.yml',ref:'main',
              });
              return;
            }
            if(verdict!=='pass') {
              await tag('voro-ci-rejected','d73a4a');
              await note(`Checks did not pass (${verdict}). No merge performed. Fix the branch and push a new commit to trigger re-evaluation.`);
              return;
            }
            const sourcePaths=files.map(f=>f.filename).filter(f=>f.startsWith('webs/src/'));
            if(sourcePaths.length) {
              const others=await github.paginate(github.rest.pulls.list,{
                owner,repo,state:'open',base:'main',per_page:100
              });
              for(const other of others) {
                if(other.number===n || other.draft)continue;
                const otherFiles=await github.paginate(github.rest.pulls.listFiles,{
                  owner,repo,pull_number:other.number,per_page:100
                });
                if(otherFiles.some(f=>sourcePaths.includes(f.filename))) {
                  await tag('voro-manual-review');
                  await note(`Overlapping source changes in PR #${other.number}. Avoiding duplicate/partial auto-merge.`);
                  return;
                }
              }
            }
            const {data:mainBranch}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(mainBranch.commit.sha!==process.env.BASE) {
              core.warning('Main moved after verification. Refusing untested merge.');
              return;
            }
            try {
              await github.rest.pulls.createReview({owner,repo,pull_number:n,event:'APPROVE',
                body:'Automated disposable-merge build and regression suite passed.'});
            } catch(e) {
              await tag('voro-manual-review');
              core.warning('Approval unavailable: '+String(e.message));
              return;
            }
            const {data:revalidated}=await github.rest.pulls.get({owner,repo,pull_number:n});
            const {data:mainBeforeMerge}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(revalidated.head.sha!==process.env.SHA ||
               mainBeforeMerge.commit.sha!==process.env.BASE || revalidated.state!=='open') {
              core.warning('Heads changed during approval. Merge cancelled.');
              return;
            }
            const merged=await github.rest.pulls.merge({owner,repo,pull_number:n,sha:p.head.sha,merge_method:'squash'});
            if(!merged.data.merged) core.setFailed('GitHub refused the merge.');


      - name: Record evaluated head and base snapshot
        if: always() && needs.validate.outputs.number != ''
        uses: actions/github-script@v7
        env:
          NUM: ${{ needs.validate.outputs.number }}
          HEAD: ${{ needs.validate.outputs.head }}
          BASE: ${{ needs.validate.outputs.base }}
          VERDICT: ${{ needs.validate.outputs.decision }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const marker=`<!-- voro-gate-v4:${process.env.HEAD}:${process.env.BASE} -->`;
            await github.rest.issues.createComment({
              owner,repo,issue_number:Number(process.env.NUM),
              body:`${marker}\nVORO Gate examined this exact PR snapshot: ${process.env.VERDICT||'unknown'}. See Actions logs for details (decision stage: ${{ steps.decision.outcome }}).`
            });

  advance:
    name: Advance queue once, then stop if empty
    needs: [validate, decide]
    if: always() && needs.validate.outputs.number != '' && needs.decide.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger exactly one next FIFO iteration
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner:context.repo.owner,repo:context.repo.repo,
              workflow_id:'voro-pr-governance.yml',ref:'main'
            });
