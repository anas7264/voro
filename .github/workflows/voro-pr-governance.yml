name: VORO - Regression-aware Auto Merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number to evaluate'
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: voro-serial-regression-gate
  queue: max
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.select.outputs.number }}
      head: ${{ steps.select.outputs.head }}
      base: ${{ steps.select.outputs.base }}
    steps:
      - name: Select safe owner-authored repair PR
        id: select
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const n = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number;
            if (!Number.isSafeInteger(n) || n <= 0) {
              core.setFailed('Invalid PR number'); return;
            }
            const {data:p} = await github.rest.pulls.get({owner,repo,pull_number:n});
            if (p.state !== 'open' || p.draft || p.base.ref !== 'main' ||
                p.user.login !== owner || p.head.repo?.full_name !== owner+'/'+repo ||
                p.labels.some(x=>x.name==='voro-manual-review')) {
              core.setFailed('Owner-authored, same-repo, non-draft PR required'); return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles,
              {owner,repo,pull_number:n,per_page:100});
            const guarded = new Set([
              'webs/package.json','webs/package-lock.json','webs/pnpm-lock.yaml',
              'webs/src/utils/crypto.js','webs/src/utils/storage.js'
            ]);
            if (!files.length || files.some(f=>
                f.filename.startsWith('.github/') ||
                guarded.has(f.filename) ||
                /^webs\/verify_.*\.(?:js|cjs|mjs)$/.test(f.filename) &&
                  f.status !== 'added')) {
              core.setFailed('Empty PR, sensitive files or modified existing tests: manual review');
              return;
            }
            const {data:base}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            core.setOutput('number',String(n));
            core.setOutput('head',p.head.sha);
            core.setOutput('base',base.commit.sha);

      - name: Checkout tested main snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.select.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Build isolated base and merge-preview worktrees
        shell: bash
        env:
          BASE_SHA: ${{ steps.select.outputs.base }}
          HEAD_SHA: ${{ steps.select.outputs.head }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voro"
          git fetch --no-tags origin "$HEAD_SHA"
          git worktree add --detach "$RUNNER_TEMP/voro/base" "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/voro/candidate" "$BASE_SHA"
          git -C "$RUNNER_TEMP/voro/candidate" \
            -c user.name='VORO CI' -c user.email='ci@users.noreply.github.com' \
            merge --no-commit --no-ff "$HEAD_SHA"
          git -C "$RUNNER_TEMP/voro/candidate" diff --cached --check
          if git -C "$RUNNER_TEMP/voro/candidate" diff --cached --quiet; then
            echo "No effective changes against main: refuse duplicate merge" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webs/package-lock.json

      - name: Count and compare detected regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/voro/base/.github/scripts/voro_ci_compare.py"

      - name: Save detailed comparison and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voro-regression-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/voro/comparison.json
            ${{ runner.temp }}/voro/logs/
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge only the exact tested revision
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.verify.outputs.number }}
          TESTED_HEAD: ${{ needs.verify.outputs.head }}
          TESTED_BASE: ${{ needs.verify.outputs.base }}
        with:
          script: |
            const {owner,repo}=context.repo;
            const n=Number(process.env.PR_NUMBER);
            const {data:p}=await github.rest.pulls.get({owner,repo,pull_number:n});
            const {data:base}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if (p.state!=='open' || p.draft || p.base.ref!=='main' ||
                p.user.login!==owner || p.head.repo?.full_name!==owner+'/'+repo ||
                p.labels.some(x=>x.name==='voro-manual-review') ||
                p.head.sha!==process.env.TESTED_HEAD ||
                base.commit.sha!==process.env.TESTED_BASE ||
                p.mergeable!==true) {
              core.setFailed('PR/main changed or GitHub has not confirmed mergeability');
              return;
            }
            const files=await github.paginate(github.rest.pulls.listFiles,
              {owner,repo,pull_number:n,per_page:100});
            const guarded=new Set([
              'webs/package.json','webs/package-lock.json','webs/pnpm-lock.yaml',
              'webs/src/utils/crypto.js','webs/src/utils/storage.js'
            ]);
            if(!files.length || files.some(f=>f.filename.startsWith('.github/') ||
              guarded.has(f.filename) ||
              /^webs\/verify_.*\.(?:js|cjs|mjs)$/.test(f.filename) &&
                f.status!=='added')) {
              core.setFailed('Sensitive or test files changed since validation');return;
            }
            const {data:r}=await github.rest.pulls.merge({
              owner,repo,pull_number:n,sha:process.env.TESTED_HEAD,merge_method:'squash'
            });
            if(!r.merged)core.setFailed(r.message || 'GitHub refused merge');
