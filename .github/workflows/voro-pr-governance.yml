name: VORO CI & Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Existing PR number to validate and merge'
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: voro-ci-auto-merge
  queue: max
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      base: ${{ steps.pr.outputs.base }}
    steps:
      - name: Verify PR is eligible
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.pr_number)
              : context.payload.pull_request.number;
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.user.login !== owner || pr.head.repo?.full_name !== owner + '/' + repo ||
                pr.labels.some(l => l.name === 'voro-manual-review')) {
              core.setFailed('PR is not eligible for automatic merge');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            if (files.some(f => f.filename.startsWith('.github/') ||
                ['webs/package.json', 'webs/package-lock.json', 'webs/pnpm-lock.yaml',
                 'webs/src/utils/crypto.js', 'webs/src/utils/storage.js'].includes(f.filename))) {
              core.setFailed('Sensitive files changed; manual review required');
              return;
            }
            const {data: base} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            core.setOutput('number', String(number));
            core.setOutput('head', pr.head.sha);
            core.setOutput('base', base.commit.sha);

      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check merge conflicts and whitespace
        shell: bash
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          git -c user.name='VORO CI' -c user.email='ci@users.noreply.github.com' merge --no-commit --no-ff "$HEAD_SHA"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'PR has no new changes to merge' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webs/package-lock.json

      - name: Install, build and test
        working-directory: webs
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          for test in \
            verify_storage_security.js \
            verify_masterclass_luxury.cjs \
            verify_daily_perf_v20.cjs \
            verify_formatters_hardening.js \
            verify_calculators_perf.js; do
            node "$test"
          done
          if test -f verify_async_storage_purge.js; then
            node verify_async_storage_purge.js
          fi

  merge:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge only the exact tested commit
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.ci.outputs.number }}
          TESTED_HEAD: ${{ needs.ci.outputs.head }}
          TESTED_BASE: ${{ needs.ci.outputs.base }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const number = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: number});
            const {data: base} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' ||
                pr.user.login !== owner || pr.head.repo?.full_name !== owner + '/' + repo ||
                pr.labels.some(l => l.name === 'voro-manual-review') ||
                pr.head.sha !== process.env.TESTED_HEAD ||
                base.commit.sha !== process.env.TESTED_BASE ||
                pr.mergeable === false) {
              core.setFailed('PR or main changed after tests, or merge is blocked. No merge.');
              return;
            }
            const {data: result} = await github.rest.pulls.merge({
              owner, repo, pull_number: number,
              sha: process.env.TESTED_HEAD,
              merge_method: 'squash'
            });
            if (!result.merged) core.setFailed(result.message || 'Merge refused');
