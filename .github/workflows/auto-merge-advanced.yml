name: 🚀 Advanced Auto-Merge Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ✅ المرحلة 1: فحص البناء
  build-verification:
    name: 🔨 Build Verification
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'webs/pnpm-lock.yaml'
      
      - name: 🔍 Install Dependencies
        working-directory: webs
        run: pnpm install --frozen-lockfile
      
      - name: 🏗️ Build Application
        working-directory: webs
        run: pnpm run build
      
      - name: 🧪 Masterclass Verification Suite
        working-directory: webs
        run: node verify_masterclass_luxury.cjs

  # ✅ المرحلة 2: فحص الاختبارات
  test-verification:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'webs/pnpm-lock.yaml'
      
      - name: 🔍 Install Dependencies
        working-directory: webs
        run: pnpm install --frozen-lockfile
      
      - name: 🧪 Run Verification & Test Suites
        working-directory: webs
        run: |
          echo "Running repository verification scripts..."
          node verify_storage_security.js
          node verify_security_headers.js
          node verify_formatters_hardening.js

          if pnpm list @playwright/test > /dev/null 2>&1 && [ -f "playwright.config.js" -o -f "playwright.config.ts" ]; then
            pnpm exec playwright install --with-deps
            pnpm exec playwright test --reporter=json > test-results.json
            echo "✅ Playwright tests executed successfully"
          else
            echo "ℹ️ No Playwright test configuration file found, verification scripts passed."
          fi

  # ✅ المرحلة 3: فحص الأمان والـ Code Quality
  security-checks:
    name: 🔒 Security & Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'webs/pnpm-lock.yaml'

      - name: 🔍 Install Dependencies
        working-directory: webs
        run: pnpm install --frozen-lockfile

      - name: 🔒 Run Security & Injection Shield Verification
        working-directory: webs
        run: |
          echo "🔍 Checking for credential leakage in source code..."
          if grep -r -i "password\s*=\s*['\"][^'\"]\+['\"]\|secret\s*=\s*['\"][^'\"]\+['\"]\|api_key\s*=\s*['\"][^'\"]\+['\"]" --include="*.js" --include="*.jsx" --include="*.ts" --include="*.tsx" src/ 2>/dev/null; then
            echo "❌ Hardcoded credentials found in source code!"
            exit 1
          else
            echo "✅ No hardcoded credentials detected"
          fi
          
          node verify_prompt_injection_shield.js
          node verify_ssrf_and_qp_hardening.js
      
      - name: 📋 ESLint Check
        working-directory: webs
        run: |
          if pnpm list eslint > /dev/null 2>&1; then
            pnpm exec eslint src/ --max-warnings=0
          else
            echo "ℹ️ ESLint not configured in package.json devDependencies"
          fi

  # ✅ المرحلة 4: التحليل الذكي والتحقق التجميعي الصارم
  smart-analysis:
    name: 🧠 Smart Analysis
    runs-on: ubuntu-latest
    needs: [build-verification, test-verification, security-checks]
    if: always()
    outputs:
      should-merge: ${{ steps.decision.outputs.should-merge }}
      merge-reason: ${{ steps.decision.outputs.reason }}
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📊 Analyze PR Quality & Required Status Checks
        id: decision
        run: |
          echo "Analyzing PR quality metrics and status checks..."
          
          BUILD_RES="${{ needs.build-verification.result }}"
          TEST_RES="${{ needs.test-verification.result }}"
          SEC_RES="${{ needs.security-checks.result }}"
          
          echo "Build result: $BUILD_RES"
          echo "Test result: $TEST_RES"
          echo "Security result: $SEC_RES"
          
          SHOULD_MERGE="true"
          REASON="✅ All strict status checks passed - Safe to merge"
          
          if [ "$BUILD_RES" != "success" ] || [ "$TEST_RES" != "success" ] || [ "$SEC_RES" != "success" ]; then
            REASON="❌ Required status checks failed (Build: $BUILD_RES, Tests: $TEST_RES, Security: $SEC_RES) - Auto-merge blocked"
            SHOULD_MERGE="false"
          fi
          
          if [ "$SHOULD_MERGE" = "true" ]; then
            CHANGED_FILES=$(git diff --name-only origin/main... | wc -l)
            CHANGED_LINES=$(git diff --shortstat origin/main... | awk '{print $4}' | tr -d '+' || echo "0")

            if [ "$CHANGED_FILES" -gt 100 ]; then
              REASON="⚠️ Large PR ($CHANGED_FILES files changed) - Manual review required"
              SHOULD_MERGE="false"
            elif [ "${CHANGED_LINES:-0}" -gt 5000 ]; then
              REASON="⚠️ Too many lines changed ($CHANGED_LINES+) - Manual review needed"
              SHOULD_MERGE="false"
            fi

            if [[ "${{ github.event.pull_request.labels.*.name }}" == *"blocked"* ]]; then
              REASON="🚫 PR is marked as blocked - Cannot merge"
              SHOULD_MERGE="false"
            fi

            if [[ "${{ github.event.pull_request.labels.*.name }}" == *"do-not-merge"* ]]; then
              REASON="🚫 PR marked as do-not-merge"
              SHOULD_MERGE="false"
            fi
          fi
          
          echo "should-merge=$SHOULD_MERGE" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT
          
          echo "### 🧠 Smart Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "$REASON" >> $GITHUB_STEP_SUMMARY

  # ✅ المرحلة 5: الموافقة التلقائية المقترنة باجتياز الفحوصات
  auto-approve:
    name: ✅ Auto Approve
    runs-on: ubuntu-latest
    needs: [smart-analysis]
    if: needs.smart-analysis.outputs.should-merge == 'true' && github.event.pull_request.draft == false

    permissions:
      pull-requests: write
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: ✅ Approve PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            console.log(`✅ Approving PR #${pr.number}...`);
            
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: '🤖 Auto-approved by VORO Auto-Merge Bot\n\n✅ All required status checks passed:\n- Build verification\n- Test suite\n- Security & injection checks\n- PR size constraints\n\n*Automated approval.*'
              });
              console.log(`✅ PR #${pr.number} approved successfully`);
            } catch (error) {
              console.log(`⚠️ Approval skipped or failed gracefully: ${error.message}`);
            }

  # ✅ المرحلة 6: الـ Merge التلقائي المشروط صراحة
  auto-merge:
    name: 🎯 Conditional Auto-Merge
    runs-on: ubuntu-latest
    needs: [auto-approve, smart-analysis]
    if: needs.smart-analysis.outputs.should-merge == 'true'
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🎯 Execute Merge
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const number = pr.number;
            
            console.log(`🎯 Executing squash merge for PR #${number}...`);
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                merge_method: 'squash',
                commit_title: pr.title,
                commit_message: `🤖 Auto-Merged PR #${number}: ${pr.title}`
              });
              console.log(`✅ PR #${number} merged successfully!`);
            } catch (mergeError) {
              console.error(`❌ Direct merge failed: ${mergeError.message}`);
              core.setFailed(`Merge failed: ${mergeError.message}`);
            }
      
      - name: 🗑️ Delete Branch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.head && pr.head.ref) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${pr.head.ref}`
                });
                console.log(`🗑️ Branch ${pr.head.ref} deleted`);
              } catch (error) {
                console.log(`⚠️ Could not delete branch: ${error.message}`);
              }
            }

  # ❌ المرحلة 7: معالجة الرفض وإضافة التنبيهات عند الفشل
  merge-failed:
    name: ❌ Handle Merge Failures
    runs-on: ubuntu-latest
    needs: [smart-analysis]
    if: needs.smart-analysis.outputs.should-merge == 'false'
    
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: 📝 Add Warning Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const reason = `${{ needs.smart-analysis.outputs.merge-reason }}`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: `⚠️ **Auto-Merge Skipped / Blocked**\n\n**Reason:** ${reason}\n\n**Action Required:** Manual engineering review required before merging.\n\n📋 Please inspect failing status checks and resolve issues.`
            });
      
      - name: 🏷️ Add Review Label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['needs-review']
              });
            } catch (err) {
              console.log(`Labeling notice: ${err.message}`);
            }
