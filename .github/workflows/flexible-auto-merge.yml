name: 🚀 Flexible Auto-Merge Bot

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  # المرحلة 1: فحص البناء والتحقق الصارم
  build-and-verify:
    name: 🔨 Build & Verification Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: 'webs/pnpm-lock.yaml'
      
      - name: 🔍 Install Dependencies
        working-directory: webs
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Production Build Test
        working-directory: webs
        run: pnpm run build

      - name: 🧪 Masterclass Verification Suite
        working-directory: webs
        run: node verify_masterclass_luxury.cjs

  # المرحلة 2: قبول تلقائي مقترن بنجاح الفحوصات
  auto-approve-flexible:
    name: ✅ Auto-Approve (Post-Verification)
    runs-on: ubuntu-latest
    needs: [build-and-verify]
    if: github.event.pull_request.draft == false

    permissions:
      pull-requests: write
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: ✅ Approve PR
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                event: 'APPROVE',
                body: '🤖 **تأكيد الموافقة التلقائية من VORO Bot**\n\n✅ تم اجتياز جميع فحوصات البناء والتحقق الصارم بنجاح.'
              });
              console.log(`✅ PR #${pr.number} approved successfully`);
            } catch (error) {
              console.log(`⚠️ Approval skipped or already present: ${error.message}`);
            }

  # المرحلة 3: الـ Merge التلقائي المشروط بنجاح الفحوصات والموافقة
  auto-merge-instant:
    name: 🎯 Conditional Auto-Merge
    runs-on: ubuntu-latest
    needs: [build-and-verify, auto-approve-flexible]
    
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🎯 Execute Merge
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            
            const prNumber = pr.number;
            console.log(`🎯 Attempting safe merge for PR #${prNumber}...`);
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash',
                commit_message: `🤖 Auto-Merged: ${pr.title}`,
                commit_title: pr.title
              });
              console.log('✅ Squash merge successful!');
            } catch (error) {
              console.error(`❌ Merge attempt failed: ${error.message}`);
              core.setFailed(`Merge failed: ${error.message}`);
            }
      
      - name: 🗑️ Delete Branch
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.head.ref) return;
            
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${pr.head.ref}`
              });
              console.log(`✅ Branch deleted: ${pr.head.ref}`);
            } catch (error) {
              console.log(`⚠️ Could not delete branch: ${error.message}`);
            }

  # المرحلة 4: إرسال بريد تأكيد عند نجاح الـ Merge
  send-confirmation-email:
    name: 📧 Send Confirmation Email
    runs-on: ubuntu-latest
    needs: [auto-merge-instant]
    if: success()
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 📧 Extract Email Info
        id: email-info
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            
            core.setOutput('author', pr.user.login);
            core.setOutput('pr-number', pr.number);
            core.setOutput('pr-title', pr.title);
            core.setOutput('pr-url', pr.html_url);
      
      - name: 📧 Send Email via SendGrid/SMTP
        if: env.HAS_EMAIL_SECRETS == 'true'
        env:
          HAS_EMAIL_SECRETS: ${{ secrets.EMAIL_USERNAME != '' && secrets.EMAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ تأكيد دمج التعديلات - VORO Project"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "VORO Auto-Merge Bot <noreply@voro.dev>"
          body: |
            🎉 تأكيد نجاح الـ Merge
            
            تم دمج التعديلات بنجاح في مشروع VORO بعد اجتياز كافة فحوصات الأمان والتحقق.
            
            📋 تفاصيل الـ PR:
            - رقم الـ PR: #${{ steps.email-info.outputs.pr-number }}
            - العنوان: ${{ steps.email-info.outputs.pr-title }}
            - المؤلف: ${{ steps.email-info.outputs.author }}
            
            🔗 الرابط: ${{ steps.email-info.outputs.pr-url }}
            
            هذا بريد تلقائي من نظام VORO Auto-Merge Bot

  # المرحلة 5: تعليق النجاح
  success-comment:
    name: 💬 Post Success Comment
    runs-on: ubuntu-latest
    needs: [auto-merge-instant]
    if: success()

    permissions:
      pull-requests: write
      issues: write
    
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      
      - name: 💬 Add Success Comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🎉 **تم الـ Merge بنجاح!**

| المعلومة | القيمة |
|---------|--------|
| 🤖 الطريقة | Verified Automatic Merge |
| 🏗️ البناء | ✅ PASSED |
| 📊 نوع الـ Merge | Squash |
| ✅ الحالة | مكتمل |

✅ تم الفحص والدمج بنجاح في \`main\`.`
              });
            } catch (error) {
              console.log(`⚠️ Comment failed: ${error.message}`);
            }
